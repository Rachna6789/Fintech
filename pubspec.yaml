name: fintrack
description: A production-ready cross-platform fintech portfolio tracker.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  firebase_messaging: ^15.2.5
  firebase_storage: ^12.4.5
  google_sign_in: ^6.3.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  hive_flutter: ^1.1.0
  dio: ^5.8.0+1
  socket_io_client: ^2.0.3+1
  cached_network_image: ^3.2.3
  firebase_crashlytics: 4.3.10
  firebase_analytics: ^11.1.1
  connectivity_plus: ^6.1.4
  intl: ^0.20.2
  flutter_local_notifications: ^22.0.1
  dynamic_color: ^1.7.0

flutter:
  uses-material-design: true

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test: 
    sdk: flutter
